<div
  class="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
  <!-- Reusable Responsive Sidebar -->
  <app-sidebar [collapsed]="isSidebarCollapsed()" [mobileOpen]="isMobileSidebarOpen()"
    (closeMobile)="closeMobileSidebar()"></app-sidebar>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Navbar Header -->
    <app-navbar (sidebarToggle)="toggleSidebar()"></app-navbar>

    <!-- Page Content Viewport -->
    <main class="relative flex-1 min-h-0 p-4 sm:p-6 lg:p-8 overflow-y-auto">
      <app-loader></app-loader>
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Toast Alerts -->
  <app-toast-container></app-toast-container>
</div>
